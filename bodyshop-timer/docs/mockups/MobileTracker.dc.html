<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customer repair tracker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#007A78}a:hover{color:#005C5A}
.grid-bg{background-color:#FFFFFF;background-image:linear-gradient(rgba(37,40,42,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(37,40,42,.045) 1px,transparent 1px);background-size:32px 32px}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.cut-sm{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
</style>
</helmet>
<div class="grid-bg" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; color: #25282A; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; padding: 28px 20px 24px; gap: 18px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .14em; color: #25282A; border-bottom: 3px solid #00EEEA; padding-bottom: 2px">AUTOBODIES</span>
    <button type="button" aria-label="Notifications" class="cut-sm" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F5F5F5; border: 1px solid #E2E6E7; color: #25282A; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #5F6368">YOUR REPAIR · AB-24117</span>
    <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; text-transform: uppercase">Toyota HiLux SR5</h1>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5F6368">QLD 482·KTZ</span>
  </div>

  <div class="cut" style="padding: 20px; background: #FFFFFF; border: 1px solid #00EEEA; box-shadow: 0 0 28px rgba(0,238,234,.22); display: flex; align-items: center; gap: 18px">
    <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Repair 3 of 7 stages done, now on panel work">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#E2E6E7" stroke-width="8"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#E11D2E" stroke-width="8" stroke-dasharray="132 264" transform="rotate(-90 50 50)"/>
      <text x="50" y="56" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="22" fill="#25282A">4/7</text>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #E11D2E">NOW · PANEL WORK</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.2">Ready Tue 3 Nov</span>
      <span style="font-size: 13px; color: #5F6368; line-height: 1.4">We'll text you when it's out of the paint booth.</span>
    </div>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
      <li style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 40px">
        <span style="{{s.dot}}"></span>
        <span style="{{s.label}}">{{s.name}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .1em; color: #5F6368">{{s.when}}</span>
      </li>
    </sc-for>
  </ol>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <a href="tel:0755277175" class="cut-sm" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: #FFFFFF; border: 1px solid #25282A; color: #25282A; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: .1em; font-size: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      CALL SHOP
    </a>
    <a href="#" class="cut-sm" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; background: #00EEEA; color: #0B0C0D; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: .1em; font-size: 14px">VIEW PHOTOS</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const RED = '#E11D2E';
    const data = [['Checked in','WED'],['Assessed','WED'],['Insurer approved','FRI'],['Panel work','NOW'],['Paint','—'],['Reassembly','—'],['Ready to collect','TUE']];
    const current = 3;
    const steps = data.map(([name, when], i) => {
      const done = i < current, now = i === current;
      return {
        name, when,
        dot: `width:12px;height:12px;justify-self:center;transform:rotate(45deg);${done ? `background:${RED}` : now ? `background:#FFFFFF;border:2px solid ${RED};box-shadow:0 0 8px rgba(225,29,46,.5)` : 'background:#FFFFFF;border:2px solid #A4AAB3'}`,
        label: `font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;color:${now ? RED : done ? '#25282A' : '#5F6368'}`
      };
    });
    return { steps };
  }
}
</script>
</body>
</html>
